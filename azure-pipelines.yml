trigger:
- master
- Release_*
- dev/*

variables:
  CCACHE_DIR: "$(Build.ArtifactStagingDirectory)/.ccache"
  CCACHE_BASEDIR: "$(Build.Repository.LocalPath)"
  CCACHE_STATSLOG: "$(Build.ArtifactStagingDirectory)/ccache_current_build_stats.log"
  CCACHE_NOHASHDIR: yes
  CCACHE_NAMESPACE: "$(System.JobDisplayName)"
  CCACHE_MAXSIZE: 1G
  CCACHE_SLOPPINESS: time_macros
  # Conditionally set BUILD_BRANCH_NAME based on the trigger type
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    BUILD_BRANCH_NAME: 'pr/$(system.pullRequest.pullRequestNumber)/$(System.PullRequest.SourceBranch)'
  ${{ else }}:
    BUILD_BRANCH_NAME: '$(Build.SourceBranchName)'


jobs:
- job: Ubuntu_x64_minimallib_build
  timeoutInMinutes: 120
  pool:
    vmImage: ubuntu-latest
  steps:
  - task: DockerCompose@1
    displayName: 'Build MinimalLib JS bindings'
    inputs:
      projectName: 'rdkit-minimallib-ci'
      action: 'Build services'
      dockerComposeFile: './Code/MinimalLib/docker/docker_compose_build_minimallib.yml'
      dockerComposeFileArgs: |
        GET_SRC=copy
        COMPOSE_BAKE=false
- job: Ubuntu_x64_base # more or less the oldest version of what we support
  timeoutInMinutes: 120
  pool:
    vmImage: ubuntu-22.04
  variables:
    python: python=3.10
    boost_version: 1.82.0
    compiler: gxx_linux-64
    number_of_cores: nproc
    cc: gcc-11
    cxx: g++-11
  steps:
  - template: .azure-pipelines/linux_build.yml
- job: Ubuntu_x64_new # up to date version of things
  timeoutInMinutes: 120
  pool:
    vmImage: ubuntu-latest
  variables:
    python: python=3.14
    boost_version: 1.92
    compiler: gxx_linux-64
    number_of_cores: nproc
  steps:
  - template: .azure-pipelines/linux_build_new.yml
- job: Ubuntu_x64_nb
  timeoutInMinutes: 120
  pool:
    vmImage: ubuntu-latest
  variables:
    python: python=3.14
    boost_version: 1.92
    number_of_cores: nproc
  steps:
  - template: .azure-pipelines/linux_build_nb.yml
- job: macOS_x64
  timeoutInMinutes: 120
  pool:
    vmImage: macos-14
  variables:
    compiler: clangxx_osx-64=18.1
    boost_version: 1.92
    number_of_cores: sysctl -n hw.ncpu
    target_platform: 14
    python: python=3.14
  steps:
  - template: .azure-pipelines/mac_build.yml
- job: macOS_x64_java
  timeoutInMinutes: 90
  pool:
    vmImage: macos-14
  variables:
    compiler: clangxx_osx-64=18.1
    boost_version: 1.91
    number_of_cores: sysctl -n hw.ncpu
    target_platform: 14
  steps:
  - template: .azure-pipelines/mac_build_java.yml
- job: Windows_VS2022_x64
  timeoutInMinutes: 150
  pool:
    vmImage: windows-2022
  variables:
    boost_version: 1.92
    number_of_cores: '%NUMBER_OF_PROCESSORS%'
    python: python=3.14
  steps:
  - template: .azure-pipelines/vs_build.yml
- job: Windows_VS2022_x64_dll
  timeoutInMinutes: 120
  pool:
    vmImage: windows-2022
  variables:
    boost_version: 1.92
    number_of_cores: '%NUMBER_OF_PROCESSORS%'
    python: python=3.14
  steps:
  - template: .azure-pipelines/vs_build_dll.yml
- job: Ubuntu_x64_cartridge
  timeoutInMinutes: 90
  pool:
    vmImage: ubuntu-latest
  variables:
    boost_version: 1.92
    number_of_cores: nproc
    compiler: gxx_linux-64
  steps:
  - template: .azure-pipelines/linux_build_cartridge.yml
- job: Ubuntu_x64_limitexternaldependencies
  timeoutInMinutes: 90
  pool:
    vmImage: ubuntu-latest
  variables:
    python: python=3.14
    boost_version: 1.92
    number_of_cores: nproc
    compiler: gxx_linux-64
  steps:
  - template: .azure-pipelines/linux_build_limitexternal.yml
- job: Ubuntu_x64_java
  timeoutInMinutes: 90
  pool:
    vmImage: ubuntu-latest
  variables:
    boost_version: 1.92.0
    number_of_cores: nproc
    compiler: gxx_linux-64
  steps:
  - template: .azure-pipelines/linux_build_java.yml
- job: Windows_VS2022_x64_swig
  timeoutInMinutes: 90
  pool:
    vmImage: windows-2022
  variables:
    boost_version: 1.84.0
    number_of_cores: '%NUMBER_OF_PROCESSORS%'
  steps:
  - template: .azure-pipelines/vs_build_swig.yml

