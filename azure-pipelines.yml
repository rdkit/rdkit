trigger:
- master
- Release_*
- dev/*

variables:
  CCACHE_DIR: "$(Build.ArtifactStagingDirectory)/.ccache"
  CCACHE_BASEDIR: "$(Build.Repository.LocalPath)"
  CCACHE_STATSLOG: "$(Build.ArtifactStagingDirectory)/ccache_current_build_stats.log"
  CCACHE_NOHASHDIR: yes
  CCACHE_NAMESPACE: "$(System.JobDisplayName)"
  CCACHE_MAXSIZE: 1G
  CCACHE_SLOPPINESS: time_macros
  # Conditionally set BUILD_BRANCH_NAME based on the trigger type
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    BUILD_BRANCH_NAME: 'pr/$(system.pullRequest.pullRequestNumber)/$(System.PullRequest.SourceBranch)'
  ${{ else }}:
    BUILD_BRANCH_NAME: '$(Build.SourceBranchName)'


jobs:
# Marking a draft PR ready for review queues a new PR build with no new
# commits, and the pr trigger has no setting to ignore that event. The other
# jobs skip a PR build whose head commit already has a passing build.
- job: Check_earlier_builds
  timeoutInMinutes: 5
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: none
  - bash: |
      python3 - <<'EOF'
      import json
      import os
      import urllib.parse
      import urllib.request

      collection = os.environ["SYSTEM_COLLECTIONURI"]
      project = os.environ["SYSTEM_TEAMPROJECTID"]
      commit = os.environ.get("SYSTEM_PULLREQUEST_SOURCECOMMITID", "")
      query = urllib.parse.urlencode({
          "definitions": os.environ["SYSTEM_DEFINITIONID"],
          "branchName": os.environ["BUILD_SOURCEBRANCH"],
          "reasonFilter": "pullRequest",
          "statusFilter": "completed",
          "resultFilter": "succeeded",
          "api-version": "7.1",
      })
      passed = "false"
      try:
          url = f"{collection}{project}/_apis/build/builds?{query}"
          with urllib.request.urlopen(url, timeout=30) as response:
              builds = json.load(response)["value"]
          for build in builds:
              if commit and build.get("triggerInfo", {}).get("pr.sourceSha") == commit:
                  passed = "true"
                  print(f"{commit} already passed in "
                        f"{collection}{project}/_build/results?buildId={build['id']}")
                  break
          else:
              print(f"No passing build of {commit} yet")
      except Exception as error:
          # Fail open: an unreachable API runs the full build.
          print(f"##vso[task.logissue type=warning]Could not list earlier builds: {error}")
      print(f"##vso[task.setvariable variable=passed;isOutput=true]{passed}")
      EOF
    name: earlier
    displayName: Look for a passing build of this PR commit
    condition: eq(variables['Build.Reason'], 'PullRequest')
- job: Ubuntu_x64_minimallib_build
  dependsOn: Check_earlier_builds
  condition: and(succeeded(), ne(dependencies.Check_earlier_builds.outputs['earlier.passed'], 'true'))
  timeoutInMinutes: 120
  pool:
    vmImage: ubuntu-latest
  steps:
  - task: DockerCompose@1
    displayName: 'Build MinimalLib JS bindings'
    inputs:
      projectName: 'rdkit-minimallib-ci'
      action: 'Build services'
      dockerComposeFile: './Code/MinimalLib/docker/docker_compose_build_minimallib.yml'
      dockerComposeFileArgs: |
        GET_SRC=copy
        COMPOSE_BAKE=false
- job: Ubuntu_x64_base # more or less the oldest version of what we support
  dependsOn: Check_earlier_builds
  condition: and(succeeded(), ne(dependencies.Check_earlier_builds.outputs['earlier.passed'], 'true'))
  timeoutInMinutes: 120
  pool:
    vmImage: ubuntu-22.04
  variables:
    python: python=3.10
    boost_version: 1.82.0
    compiler: gxx_linux-64
    number_of_cores: nproc
    cc: gcc-11
    cxx: g++-11
  steps:
  - template: .azure-pipelines/linux_build.yml
- job: Ubuntu_x64_new # up to date version of things
  dependsOn: Check_earlier_builds
  condition: and(succeeded(), ne(dependencies.Check_earlier_builds.outputs['earlier.passed'], 'true'))
  timeoutInMinutes: 120
  pool:
    vmImage: ubuntu-latest
  variables:
    python: python=3.14
    boost_version: 1.92
    compiler: gxx_linux-64
    number_of_cores: nproc
  steps:
  - template: .azure-pipelines/linux_build_new.yml
- job: Ubuntu_x64_nb
  dependsOn: Check_earlier_builds
  condition: and(succeeded(), ne(dependencies.Check_earlier_builds.outputs['earlier.passed'], 'true'))
  timeoutInMinutes: 120
  pool:
    vmImage: ubuntu-latest
  variables:
    python: python=3.14
    boost_version: 1.92
    number_of_cores: nproc
  steps:
  - template: .azure-pipelines/linux_build_nb.yml
- job: macOS_x64
  dependsOn: Check_earlier_builds
  condition: and(succeeded(), ne(dependencies.Check_earlier_builds.outputs['earlier.passed'], 'true'))
  timeoutInMinutes: 120
  pool:
    vmImage: macos-14
  variables:
    compiler: clangxx_osx-64=18.1
    boost_version: 1.92
    number_of_cores: sysctl -n hw.ncpu
    target_platform: 14
    python: python=3.14
  steps:
  - template: .azure-pipelines/mac_build.yml
- job: macOS_x64_java
  dependsOn: Check_earlier_builds
