steps:
- bash: |
    echo -e "CCACHE_DIR=${CCACHE_DIR}"
    echo -e "CCACHE env vars"
    export | grep -i ccache
  displayName: Get commit hashes and print cache variables
- task: Cache@2
  inputs:
    key: 'ccache | "$(Agent.OS)" | "$(System.JobDisplayName)" | "$(Build.SourceBranchName)" | "$(Build.SourceVersion)"'
    path: $(CCACHE_DIR)
    cacheHitVar: CACHE_RESTORED
    restoreKeys: |
      ccache | "$(Agent.OS)" | "$(System.JobDisplayName)" | "$(Build.SourceBranchName)"
      ccache | "$(Agent.OS)" | "$(System.JobDisplayName)" | "master"
  displayName: "Cache ccache directory"