steps:
- powershell: Write-Host "##vso[task.prependpath]$env:CONDA\Scripts"
  displayName: Setup build environment
- script: |
    conda config --set always_yes yes --set changeps1 no
    conda info -a
    conda install -n base conda-libmamba-solver
    conda config --set solver libmamba
    conda create --name rdkit_build -c conda-forge --override-channels  $(python) ^
        vs2022_win-64 libboost-python=(boost_version) ^
        libboost-python-devel=(boost_version) ^
        libboost=$(boost_version) ^
        libboost-devel=$(boost_version) ^
        numpy matplotlib cairo pillow eigen ^
        numpy=2.4 pandas=3 ^
        sphinx myst-parser ipython jupyter pytest nbval cmake expat ccache ninja
    call activate rdkit_build
    conda config --env --add channels conda-forge
    conda config --env --set channel_priority strict
  displayName: Install dependencies
- bash: |
    # Pull branch names from origin, then get 3 more commits from this branch and 1 from master
    git remote set-branches origin '*'
    git fetch origin $(Build.SourceBranchName) --depth=4
    git fetch origin master --depth=1
    echo "##vso[task.setvariable variable=current_hash;]`git log --pretty=%H -n 1 HEAD`"
    echo "##vso[task.setvariable variable=ancestor1_hash;]`git log --pretty=%H -n 1 HEAD~1`"
    echo "##vso[task.setvariable variable=ancestor2_hash;]`git log --pretty=%H -n 1 HEAD~2`"
    echo "##vso[task.setvariable variable=ancestor3_hash;]`git log --pretty=%H -n 1 HEAD~3`"
    echo "##vso[task.setvariable variable=master_hash;]`git log --pretty=%H -n 1 origin/master`"
    echo -e "CCACHE_DIR=${CCACHE_DIR}"
    echo -e "CCACHE env vars"
    export | grep -i ccache
  displayName: Get commit hashes and print cache variables
- task: Cache@2
  inputs:
    key: 'ccache | "$(Agent.OS)" | "$(System.JobDisplayName)" | "$(current_hash)"'
    path: $(CCACHE_DIR)
    cacheHitVar: CACHE_RESTORED
    restoreKeys: |
      'ccache | "$(Agent.OS)" | "$(System.JobDisplayName)" | "$(ancestor1_hash)"'
      'ccache | "$(Agent.OS)" | "$(System.JobDisplayName)" | "$(ancestor2_hash)"'
      'ccache | "$(Agent.OS)" | "$(System.JobDisplayName)" | "$(ancestor3_hash)"'
      'ccache | "$(Agent.OS)" | "$(System.JobDisplayName)" | "$(master_hash)"'
  displayName: "Cache ccache directory"
- script: |
    set Boost_ROOT=
    mkdir build && cd build
    call activate rdkit_build
    cmake .. ^
    -G "Ninja" ^
    -DCMAKE_BUILD_TYPE=Release ^
    -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
    -DRDK_INSTALL_INTREE=ON ^
    -DRDK_INSTALL_STATIC_LIBS=OFF ^
    -DRDK_BUILD_CPP_TESTS=ON ^
    -DRDK_BUILD_BOOST_PYTHON_WRAPPERS=ON ^
    -DRDK_BUILD_NANOBIND_WRAPPERS=OFF ^
    -DRDK_BUILD_COORDGEN_SUPPORT=ON ^
    -DRDK_BUILD_MAEPARSER_SUPPORT=ON ^
    -DRDK_OPTIMIZE_POPCNT=ON ^
    -DRDK_BUILD_TEST_GZIP=ON ^
    -DRDK_BUILD_FREESASA_SUPPORT=ON ^
    -DRDK_BUILD_AVALON_SUPPORT=ON ^
    -DRDK_BUILD_INCHI_SUPPORT=ON ^
    -DRDK_BUILD_YAEHMOP_SUPPORT=ON ^
    -DRDK_BUILD_XYZ2MOL_SUPPORT=ON ^
    -DRDK_BUILD_CAIRO_SUPPORT=ON ^
    -DRDK_BUILD_THREADSAFE_SSS=ON ^
    -DRDK_BUILD_SWIG_WRAPPERS=OFF ^
    -DRDK_BUILD_CFFI_LIB=ON ^
    -DRDK_SWIG_STATIC=OFF ^
    -DRDK_TEST_MULTITHREADED=ON ^
    -DCMAKE_INCLUDE_PATH=%CONDA_PREFIX%/Library/include ^
    -DCMAKE_LIBRARY_PATH="%CONDA_PREFIX%/Library/lib
  displayName: Configure build (Run CMake)
- script: |
    call activate rdkit_build
    cd build
    cmake --build . --config Release --target install -j $(number_of_cores)
  displayName: Build
- script: |
    call activate rdkit_build
    ccache -s
  displayName: "Show ccache stats"
- script: |
    call activate rdkit_build
    set RDBASE=%cd%
    set PYTHONPATH=%RDBASE%;%PYTHONPATH%
    set PATH=%RDBASE%\lib;%PATH%
    cd build
    ctest -C Release -j $(number_of_cores) --output-on-failure -E shard -T Test
  displayName: Run tests
- script: |
    call activate rdkit_build
    set RDBASE=%cd%
    set PYTHONPATH=%RDBASE%;%PYTHONPATH%
    set PATH=%RDBASE%\lib;%PATH%
    cd build
    ctest -C Release -j $(number_of_cores) --output-on-failure -R shard -T Test
  displayName: Run sharded tests
- script: |
    call activate rdkit_build
    conda install -c conda-forge --override-channels  numpy=1.26 pandas=2.2
    set RDBASE=%cd%
    set PYTHONPATH=%RDBASE%;%PYTHONPATH%
    set PATH=%RDBASE%\lib;%PATH%
    cd build
    ctest -C Release -j $(number_of_cores) --output-on-failure -E shard -T Test
  displayName: Run with older numpy and pandas
- script: |
    call activate rdkit_build
    conda install -c conda-forge --override-channels  sphinx myst-parser
    set RDBASE=%cd%
    set PYTHONPATH=%RDBASE%;%PYTHONPATH%
    set PATH=%RDBASE%\lib;%PATH%
    cd Docs/Book
    make doctest
  displayName: Run documentation tests
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'CTest'
    testResultsFiles: 'build/Testing/*/Test.xml'
    testRunTitle: $(system.phasedisplayname)  CTest Test Run
