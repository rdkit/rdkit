name: macOS_arm64_java

on:
  workflow_call:

jobs:
  macOS_arm64_java:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      COMPILER: clangxx_osx-arm64=18.1
      BOOST_VERSION: "1.91"
      TARGET_PLATFORM: "14"
      CONDA: /tmp/miniforge
    steps:
      - uses: actions/checkout@v7
      - name: Set up CI environment
        uses: ./.github/actions/ci-env
      - name: Set up package management
        uses: ./.github/actions/setup-package-management
      - name: Setup build environment
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          sudo chown -R ${USER} ${CONDA}
          mkdir -p $HOME/.matplotlib
          echo -e "backend: TkAgg\n" > $HOME/.matplotlib/matplotlibrc
          conda config --set always_yes yes --set changeps1 no
          conda update -q conda
          conda create --name rdkit_build -c conda-forge --override-channels ${COMPILER} \
              libcxx cmake \
              libboost=${BOOST_VERSION} \
              libboost-devel=${BOOST_VERSION} \
              cairo eigen swig make ccache freetype
          conda activate rdkit_build
          conda config --env --add channels conda-forge
          conda config --env --set channel_priority strict
      - name: Restore ccache
        id: cache-restore
        uses: ./.github/actions/restore-ccache
      - name: Configure build (Run CMake)
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          ls -l /Library
          ls -l /Library/Developer
          ls -l /Library/Developer/CommandLineTools
          ls -l /Library/Developer/CommandLineTools/SDKs
          export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX${TARGET_PLATFORM}.sdk
          export CONDA_BUILD_SYSROOT=${SDKROOT}
          mkdir build && cd build && \
          cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DRDK_INSTALL_INTREE=ON \
          -DRDK_INSTALL_STATIC_LIBS=ON \
          -DRDK_BUILD_CPP_TESTS=OFF \
          -DRDK_BUILD_BOOST_PYTHON_WRAPPERS=OFF \
          -DRDK_BUILD_NANOBIND_WRAPPERS=OFF \
          -DRDK_BUILD_COORDGEN_SUPPORT=ON \
          -DRDK_BUILD_MAEPARSER_SUPPORT=ON \
          -DRDK_OPTIMIZE_POPCNT=ON \
          -DRDK_BUILD_TEST_GZIP=OFF \
          -DRDK_BUILD_FREESASA_SUPPORT=ON \
          -DRDK_BUILD_AVALON_SUPPORT=ON \
          -DRDK_BUILD_INCHI_SUPPORT=ON \
          -DRDK_BUILD_YAEHMOP_SUPPORT=ON \
          -DRDK_BUILD_XYZ2MOL_SUPPORT=ON \
          -DRDK_BUILD_SWIG_WRAPPERS=ON \
          -DRDK_SWIG_STATIC=ON \
          -DRDK_BUILD_THREADSAFE_SSS=ON \
          -DRDK_TEST_MULTITHREADED=ON
      - name: Build
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX${TARGET_PLATFORM}.sdk
          export CONDA_BUILD_SYSROOT=${SDKROOT}
          cd build
          make -j $(sysctl -n hw.ncpu) install
      - name: Trim and store ccache
        uses: ./.github/actions/store-ccache
        if: ${{ success() && steps.cache-restore.outputs.cache-hit != 'true' }}
      - name: Show ccache stats
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          echo -e "Current build stats:"
          ccache --show-log-stats
          echo -e "Global stats:"
          ccache -s
      - name: Run tests
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          export RDBASE=`pwd`
          export PYTHONPATH=${RDBASE}:${PYTHONPATH}
          export DYLD_FALLBACK_LIBRARY_PATH=${RDBASE}/lib:${RDBASE}/rdkit:${CONDA_PREFIX}/lib:${DYLD_FALLBACK_LIBRARY_PATH}
          export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX${TARGET_PLATFORM}.sdk
          export CONDA_BUILD_SYSROOT=${SDKROOT}
          export QT_QPA_PLATFORM='offscreen'
          cd build
          ctest -j $(sysctl -n hw.ncpu) --output-on-failure -T Test
