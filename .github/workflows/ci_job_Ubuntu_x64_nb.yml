name: Ubuntu_x64_nb

on:
  workflow_call:

jobs:
  Ubuntu_x64_nb:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHON: python=3.14
      BOOST_VERSION: "1.92"
    steps:
      - uses: actions/checkout@v7
      - name: Set up CI environment
        uses: ./.github/actions/ci-env
      - name: Set up package management
        uses: ./.github/actions/setup-package-management
      - name: Setup build environment (no Qt due to versioning problems)
        run: |
          sudo apt-get install g++ wget make libgl1-mesa-dev mesa-common-dev
          source ${CONDA}/etc/profile.d/conda.sh
          sudo chown -R ${USER} ${CONDA}
          conda config --set always_yes yes --set changeps1 no
          conda update -q conda
          conda info -a
          conda create --name rdkit_build -c conda-forge --override-channels ${PYTHON} cmake \
              libboost-devel=${BOOST_VERSION} \
              libboost=${BOOST_VERSION} \
              libboost-headers=${BOOST_VERSION} \
              nanobind=2 \
              numpy pillow eigen pandas matplotlib-base \
              cairo \
              ccache
          conda activate rdkit_build
          conda config --env --add channels conda-forge
          conda config --env --set channel_priority strict
          conda install -c conda-forge --override-channels ipython=9.8 jupyter nbval "ipykernel>=6.0"
      - name: Restore ccache
        id: cache-restore
        uses: ./.github/actions/restore-ccache
      - name: Configure build (Run CMake)
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          export CXXFLAGS="${CXXFLAGS} -Wall -Werror -Wextra"
          mkdir build && cd build && \
          cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DRDK_INSTALL_INTREE=ON \
          -DRDK_INSTALL_STATIC_LIBS=OFF \
          -DRDK_BUILD_CPP_TESTS=OFF \
          -DRDK_BUILD_BOOST_PYTHON_WRAPPERS=OFF \
          -DRDK_BUILD_NANOBIND_WRAPPERS=ON \
          -DRDK_BUILD_COORDGEN_SUPPORT=ON \
          -DRDK_BUILD_MAEPARSER_SUPPORT=ON \
          -DRDK_OPTIMIZE_POPCNT=ON \
          -DRDK_BUILD_TEST_GZIP=ON \
          -DRDK_BUILD_FREESASA_SUPPORT=OFF \
          -DRDK_BUILD_AVALON_SUPPORT=OFF \
          -DRDK_BUILD_INCHI_SUPPORT=OFF \
          -DRDK_BUILD_YAEHMOP_SUPPORT=OFF \
          -DRDK_BUILD_XYZ2MOL_SUPPORT=OFF \
          -DRDK_BUILD_CAIRO_SUPPORT=ON \
          -DRDK_BUILD_SWIG_WRAPPERS=OFF \
          -DRDK_SWIG_STATIC=OFF \
          -DRDK_BUILD_THREADSAFE_SSS=ON \
          -DRDK_TEST_MULTITHREADED=ON \
          -DRDK_BUILD_CFFI_LIB=OFF \
          -DBoost_NO_SYSTEM_PATHS=ON \
          -DBoost_NO_BOOST_CMAKE=TRUE \
          -DCMAKE_INCLUDE_PATH="${CONDA_PREFIX}/include" \
          -DCMAKE_LIBRARY_PATH="${CONDA_PREFIX}/lib"
      - name: Build
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          cd build
          make -j $(nproc) install
      - name: Trim and store ccache
        uses: ./.github/actions/store-ccache
        if: ${{ success() && steps.cache-restore.outputs.cache-hit != 'true' }}
      - name: Show ccache stats
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          echo -e "Current build stats:"
          ccache --show-log-stats
          echo -e "Global stats:"
          ccache -s
      - name: Run tests
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          export RDBASE=`pwd`
          export PYTHONPATH=${RDBASE}:${PYTHONPATH}
          export LD_LIBRARY_PATH=${RDBASE}/lib:${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}
          echo "LD_LIBRARY_PATH: " $LD_LIBRARY_PATH
          export QT_QPA_PLATFORM='offscreen'
          cd build
          ctest -j $(nproc) --output-on-failure -T Test
