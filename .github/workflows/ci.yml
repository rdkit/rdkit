  # Azure's macOS agents are x86_64; macos-15-intel keeps the same osx-64
  # toolchain.
  macOS_x64:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      COMPILER: clangxx_osx-64=18.1
      BOOST_VERSION: "1.92"
      TARGET_PLATFORM: "14"
      PYTHON: python=3.14
      # Where the first step installs Miniforge.
      CONDA: /tmp/miniforge
    steps:
      - uses: actions/checkout@v7
      - &install-miniforge
        name: install conda
        run: |
          wget https://github.com/conda-forge/miniforge/releases/download/26.5.3-0/Miniforge3-26.5.3-0-MacOSX-x86_64.sh
          bash Miniforge3-26.5.3-0-MacOSX-x86_64.sh -b -p "${CONDA}"
      - &remove-homebrew
        name: Remove homebrew
        run: |
          echo "Removing homebrew from Azure to avoid conflicts."
          curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/uninstall > ~/uninstall_homebrew
          chmod +x ~/uninstall_homebrew
          ~/uninstall_homebrew -fq
          rm ~/uninstall_homebrew
      - name: Setup build environment
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          sudo chown -R "${USER}" "${CONDA}"
          mkdir -p "$HOME/.matplotlib"
          echo -e "backend: TkAgg\n" > "$HOME/.matplotlib/matplotlibrc"
          conda config --set always_yes yes --set changeps1 no
          conda update -q conda
          conda config --set solver libmamba
          conda config --set channel_priority strict
          conda config --add channels conda-forge
          conda create --name rdkit_build "${PYTHON}" "${COMPILER}" libcxx cmake \
              libboost="${BOOST_VERSION}" libboost-devel="${BOOST_VERSION}" \
              libboost-python="${BOOST_VERSION}" libboost-python-devel="${BOOST_VERSION}" \
              qt \
              numpy matplotlib cairo pillow eigen pandas=3  \
              jupyter=1.0 ipython=8.20 sphinx myst-parser pytest nbval make ccache
      - *set-cache-variables
      - *restore-ccache
      - name: Configure build (Run CMake)
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          ls -l /Library
          ls -l /Library/Developer
          ls -l /Library/Developer/CommandLineTools
          ls -l /Library/Developer/CommandLineTools/SDKs
          export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX${TARGET_PLATFORM}.sdk
          export CONDA_BUILD_SYSROOT=${SDKROOT}
          export CXXFLAGS="${CXXFLAGS} -Wall -Wextra -Werror"
          mkdir build && cd build && \
          cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DRDK_INSTALL_INTREE=ON \
          -DRDK_INSTALL_STATIC_LIBS=OFF \
          -DRDK_BUILD_CPP_TESTS=ON \
          -DRDK_BUILD_BOOST_PYTHON_WRAPPERS=ON \
          -DRDK_BUILD_NANOBIND_WRAPPERS=OFF \
          -DRDK_BUILD_COORDGEN_SUPPORT=ON \
          -DRDK_BUILD_MAEPARSER_SUPPORT=ON \
          -DRDK_OPTIMIZE_POPCNT=ON \
          -DRDK_BUILD_TEST_GZIP=ON \
          -DRDK_BUILD_FREESASA_SUPPORT=ON \
          -DRDK_BUILD_AVALON_SUPPORT=ON \
          -DRDK_BUILD_INCHI_SUPPORT=ON \
          -DRDK_BUILD_YAEHMOP_SUPPORT=ON \
          -DRDK_BUILD_XYZ2MOL_SUPPORT=ON \
          -DRDK_BUILD_CAIRO_SUPPORT=ON \
          -DRDK_BUILD_QT_SUPPORT=ON \
          -DRDK_BUILD_SWIG_WRAPPERS=OFF \
          -DRDK_SWIG_STATIC=OFF \
          -DRDK_BUILD_THREADSAFE_SSS=ON \
          -DRDK_TEST_MULTITHREADED=ON \
          -DRDK_BUILD_CFFI_LIB=ON \
          -DCMAKE_OSX_SYSROOT="${SDKROOT}" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${TARGET_PLATFORM}"
      - &macos-build
        name: Build
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX${TARGET_PLATFORM}.sdk
          export CONDA_BUILD_SYSROOT=${SDKROOT}
          cd build
          make -j "$(sysctl -n hw.ncpu)" install
      - *show-ccache-stats
      - &macos-run-tests
        name: Run tests
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          export RDBASE="${PWD}"
          export PYTHONPATH=${RDBASE}:${PYTHONPATH}
          export DYLD_FALLBACK_LIBRARY_PATH=${RDBASE}/lib:${RDBASE}/rdkit:${CONDA_PREFIX}/lib:${DYLD_FALLBACK_LIBRARY_PATH}
          export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX${TARGET_PLATFORM}.sdk
          export CONDA_BUILD_SYSROOT=${SDKROOT}
          export QT_QPA_PLATFORM='offscreen'
          cd build
          ctest -j "$(sysctl -n hw.ncpu)" --output-on-failure -T Test
      - *trim-ccache
      - *save-ccache
      - *upload-test-results

  macOS_x64_java:
    runs-on: macos-15-intel
    timeout-minutes: 90
