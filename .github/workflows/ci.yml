  Windows_VS2022_x64:
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        # Azure's script steps run through cmd.exe the same way: no errexit,
        # and a step's status is the ERRORLEVEL of its last command.
        shell: cmd
    env:
      BOOST_VERSION: "1.92"
      PYTHON: python=3.14
    steps:
      - uses: actions/checkout@v7
      - &windows-conda-path
        name: Setup build environment
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:CONDA\Scripts"
      - name: Install dependencies
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda info -a
          conda install -n base conda-libmamba-solver
          conda config --set solver libmamba
          conda create --name rdkit_build -c conda-forge --override-channels  %PYTHON% ^
              vs2022_win-64 libboost-python=%BOOST_VERSION% ^
              libboost-python-devel=%BOOST_VERSION% ^
              libboost=%BOOST_VERSION% ^
              libboost-devel=%BOOST_VERSION% ^
              numpy matplotlib cairo pillow eigen ^
              numpy pandas=3 ^
              sphinx myst-parser ipython jupyter pytest nbval cmake expat ccache ninja
          call activate rdkit_build
          conda config --env --add channels conda-forge
          conda config --env --set channel_priority strict
      - *set-cache-variables
      - *restore-ccache
      - name: Configure build (Run CMake)
        run: |
          set Boost_ROOT=
          mkdir build && cd build
          call activate rdkit_build
          cmake .. ^
          -G "Ninja" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
          -DRDK_INSTALL_INTREE=ON ^
          -DRDK_INSTALL_STATIC_LIBS=OFF ^
          -DRDK_BUILD_CPP_TESTS=ON ^
          -DRDK_BUILD_BOOST_PYTHON_WRAPPERS=ON ^
          -DRDK_BUILD_NANOBIND_WRAPPERS=OFF ^
          -DRDK_BUILD_COORDGEN_SUPPORT=ON ^
          -DRDK_BUILD_MAEPARSER_SUPPORT=ON ^
          -DRDK_OPTIMIZE_POPCNT=ON ^
          -DRDK_BUILD_TEST_GZIP=ON ^
          -DRDK_BUILD_FREESASA_SUPPORT=ON ^
          -DRDK_BUILD_AVALON_SUPPORT=ON ^
          -DRDK_BUILD_INCHI_SUPPORT=ON ^
          -DRDK_BUILD_YAEHMOP_SUPPORT=ON ^
          -DRDK_BUILD_XYZ2MOL_SUPPORT=ON ^
          -DRDK_BUILD_CAIRO_SUPPORT=ON ^
          -DRDK_BUILD_THREADSAFE_SSS=ON ^
          -DRDK_BUILD_SWIG_WRAPPERS=OFF ^
          -DRDK_BUILD_CFFI_LIB=ON ^
          -DRDK_SWIG_STATIC=OFF ^
          -DRDK_TEST_MULTITHREADED=ON ^
          -DCMAKE_INCLUDE_PATH=%CONDA_PREFIX%/Library/include ^
          -DCMAKE_LIBRARY_PATH="%CONDA_PREFIX%/Library/lib
      - &windows-build
        name: Build
        run: |
          call activate rdkit_build
          cd build
          cmake --build . --config Release --target install
      - &windows-show-ccache-stats
        name: Show ccache stats
        run: |
          call activate rdkit_build
          echo Current build stats:
          ccache --show-log-stats
          echo Global stats:
          ccache -s
      - &windows-run-tests
        name: Run tests
        run: |
          call activate rdkit_build
          set RDBASE=%cd%
          set PYTHONPATH=%RDBASE%;%PYTHONPATH%
          set PATH=%RDBASE%\lib;%PATH%
          cd build
          ctest -C Release -j %NUMBER_OF_PROCESSORS% --output-on-failure -E shard -T Test
      - &windows-run-sharded-tests
        name: Run sharded tests
        run: |
          call activate rdkit_build
          set RDBASE=%cd%
          set PYTHONPATH=%RDBASE%;%PYTHONPATH%
          set PATH=%RDBASE%\lib;%PATH%
          cd build
          ctest -C Release -j %NUMBER_OF_PROCESSORS% --output-on-failure -R shard -T Test
      - name: Run documentation tests
        run: |
          call activate rdkit_build
          conda install -c conda-forge --override-channels  sphinx myst-parser
          set RDBASE=%cd%
          set PYTHONPATH=%RDBASE%;%PYTHONPATH%
          set PATH=%RDBASE%\lib;%PATH%
          cd Docs/Book
          make doctest
      - &windows-trim-ccache
        name: Trim ccache to this build's entries
        if: github.event_name == 'push'
        run: |
          call activate rdkit_build
          powershell -NoProfile -Command "ccache --evict-older-than ('{0}s' -f ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $env:CCACHE_JOB_START))"
          ccache -s
      - *save-ccache
      - *upload-test-results

