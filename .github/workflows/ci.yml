# Jobs ported from azure-pipelines.yml and .azure-pipelines/. Each job keeps
# the name, package versions, CMake options, and test commands of the Azure job
# it mirrors, so the two systems can be compared run for run.

name: CI

on:
  push:
    branches:
      - master
      - 'Release_*'
      - 'dev/**'
  pull_request:

# Pull requests share one group per PR, so a new push cancels the superseded
# run. Every push to a branch gets its own group and runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Run each script the way Azure's Bash task does: without errexit, so a
    # step's status is that of its last command.
    shell: bash {0}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_STATSLOG: ${{ github.workspace }}/ccache_current_build_stats.log
  CCACHE_NOHASHDIR: "yes"
  CCACHE_MAXSIZE: 1G
  CCACHE_SLOPPINESS: time_macros
  # The branch whose cache a run restores: the pushed branch, or a pull
  # request's base branch.
  BUILD_BRANCH_NAME: ${{ github.base_ref || github.ref_name }}

jobs:
  Ubuntu_x64_minimallib_build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build MinimalLib JS bindings
        env:
          GET_SRC: copy
          COMPOSE_BAKE: "false"
        run: >-
          docker compose
          --project-name rdkit-minimallib-ci
          --file ./Code/MinimalLib/docker/docker_compose_build_minimallib.yml
          build

  # more or less the oldest version of what we support.
  # Its steps marked with YAML anchors (&name) are reused by the jobs below.
  Ubuntu_x64_base:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHON: python=3.10
      BOOST_VERSION: 1.82.0
      CC: gcc-11
      CXX: g++-11
    steps:
      - uses: actions/checkout@v7
      - name: Setup build environment
        run: |
          sudo apt-get install g++ wget make libgl1-mesa-dev mesa-common-dev
          source "${CONDA}/etc/profile.d/conda.sh"
          sudo chown -R "${USER}" "${CONDA}"
          conda config --set always_yes yes --set changeps1 no
          conda update -q conda
          conda config --set channel_priority strict
          conda config --add channels conda-forge
          conda config --set solver libmamba
          conda info -a
          conda create --name rdkit_build -c conda-forge --override-channels "${PYTHON}" cmake \
              boost-cpp="${BOOST_VERSION}" \
              boost="${BOOST_VERSION}" \
              numpy pillow eigen=3 pandas=2.0 matplotlib-base=3.8 \
              qt=5 cairo ccache
          conda activate rdkit_build
          conda config --env --add channels conda-forge
          conda config --env --set channel_priority strict
          conda install -c conda-forge --override-channels pytest nbval "ipykernel>=6.0"
      # Mirrors .azure-pipelines/_templates/steps_setup_cache.yml: restore the
      # branch's latest cache, else master's.
      - &set-cache-variables
        name: Set cache variables
        shell: bash
        run: |
          echo "CCACHE_NAMESPACE=${GITHUB_JOB}" >> "${GITHUB_ENV}"
          echo "CCACHE_JOB_START=$(date +%s)" >> "${GITHUB_ENV}"
          echo "Branch name : ${BUILD_BRANCH_NAME}"
          echo "CCACHE_DIR=${CCACHE_DIR}"
          echo "CCACHE env vars"
          export | grep -i ccache
      - &restore-ccache
        name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ env.BUILD_BRANCH_NAME }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ env.BUILD_BRANCH_NAME }}-
            ccache-${{ runner.os }}-${{ github.job }}-master-
      - name: Configure build (Run CMake)
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          export CXXFLAGS="${CXXFLAGS} -Wall -Werror"
          mkdir build && cd build && \
          cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DRDK_INSTALL_INTREE=ON \
          -DRDK_INSTALL_STATIC_LIBS=OFF \
          -DRDK_BUILD_CPP_TESTS=ON \
          -DRDK_BUILD_BOOST_PYTHON_WRAPPERS=ON \
          -DRDK_BUILD_NANOBIND_WRAPPERS=OFF \
          -DRDK_BUILD_COORDGEN_SUPPORT=ON \
          -DRDK_BUILD_MAEPARSER_SUPPORT=ON \
          -DRDK_OPTIMIZE_POPCNT=ON \
          -DRDK_BUILD_TEST_GZIP=ON \
          -DRDK_BUILD_FREESASA_SUPPORT=ON \
          -DRDK_BUILD_AVALON_SUPPORT=ON \
          -DRDK_BUILD_INCHI_SUPPORT=ON \
          -DRDK_BUILD_YAEHMOP_SUPPORT=ON \
          -DRDK_BUILD_XYZ2MOL_SUPPORT=ON \
          -DRDK_BUILD_CAIRO_SUPPORT=ON \
          -DRDK_BUILD_QT_SUPPORT=ON \
          -DQt5_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt5 \
          -DRDK_BUILD_SWIG_WRAPPERS=OFF \
          -DRDK_SWIG_STATIC=OFF \
          -DRDK_BUILD_THREADSAFE_SSS=ON \
          -DRDK_TEST_MULTITHREADED=ON \
          -DRDK_BUILD_CFFI_LIB=ON \
          -DRDK_USE_UNITY_BUILDS=ON \
          -DBoost_NO_SYSTEM_PATHS=ON \
          -DPYTHON_EXECUTABLE="${CONDA_PREFIX}/bin/python3" \
          -DCMAKE_INCLUDE_PATH="${CONDA_PREFIX}/include" \
          -DCMAKE_LIBRARY_PATH="${CONDA_PREFIX}/lib"
      - name: Check that Eigen is enabled
        run: |
          if ! grep -Fq "RDK_BUILD_DESCRIPTORS3D:BOOL=ON" build/CMakeCache.txt; then
            echo "ERROR: Eigen support was not enabled in CMakeCache.txt"
            exit 1
          fi
      - &build
        name: Build
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          cd build
          make -j "$(nproc)" install
      - &show-ccache-stats
        name: Show ccache stats
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          echo "Current build stats:"
          ccache --show-log-stats
          echo "Global stats:"
          ccache -s
      - name: Run tests
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          export RDBASE="${PWD}"
          export PYTHONPATH=${RDBASE}:${PYTHONPATH}
          export LD_LIBRARY_PATH=${RDBASE}/lib:${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}
          echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
          export QT_QPA_PLATFORM='offscreen'
          cd build
          ctest -j "$(nproc)" --output-on-failure -E shard -T Test
      - name: Run sharded tests
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          export RDBASE="${PWD}"
          export PYTHONPATH=${RDBASE}:${PYTHONPATH}
          export LD_LIBRARY_PATH=${RDBASE}/lib:${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}
          echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
          export QT_QPA_PLATFORM='offscreen'
          cd build
          ctest -j "$(nproc)" --output-on-failure -R shard -T Test
      - name: Run tests with older numpy and pandas
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          conda install -c conda-forge --override-channels numpy=1.24 pandas=2.2
          export RDBASE="${PWD}"
          export PYTHONPATH=${RDBASE}:${PYTHONPATH}
          export LD_LIBRARY_PATH=${RDBASE}/lib:${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}
          echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
          export QT_QPA_PLATFORM='offscreen'
          cd build
          ctest -j "$(nproc)" --output-on-failure -E shard -T Test
      - name: Run documentation tests
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          conda install -c conda-forge --override-channels ipython=8.12 sphinx myst-parser
          export RDBASE="${PWD}"
          export PYTHONPATH=${RDBASE}:${PYTHONPATH}
          export LD_LIBRARY_PATH=${RDBASE}/lib:${LD_LIBRARY_PATH}
          export QT_QPA_PLATFORM='offscreen'
          cd Docs/Book
          make doctest
      # Only pushes save a cache, so the repository's Actions cache holds one
      # snapshot per job and branch rather than one per pull request. Entries
      # this build did not use are dropped first.
      - &trim-ccache
        name: Trim ccache to this build's entries
        if: github.event_name == 'push'
        run: |
          source "${CONDA}/etc/profile.d/conda.sh"
          conda activate rdkit_build
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_JOB_START ))s"
          ccache -s
      - &save-ccache
        name: Save ccache
        if: github.event_name == 'push' && steps.restore-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}
      - &upload-test-results
        name: Upload CTest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ github.job }}
          path: build/Testing/*/Test.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # up to date version of things
