name: Ubuntu_x64_minimallib_build

on:
  workflow_call:

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_STATSLOG: ${{ github.workspace }}/ccache_current_build_stats.log
  CCACHE_NOHASHDIR: "yes"
  CCACHE_NAMESPACE: ${{ github.job }}
  CCACHE_MAXSIZE: 1G
  CCACHE_SLOPPINESS: time_macros
  BUILD_BRANCH_NAME: ${{ github.event_name == 'pull_request' && format('pr/{0}/{1}', github.event.pull_request.number, github.head_ref) || github.ref_name }}

jobs:
  Ubuntu_x64_minimallib_build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build MinimalLib JS bindings
        env:
          GET_SRC: copy
          COMPOSE_BAKE: "false"
        run: |
          docker compose -p rdkit-minimallib-ci \
            -f ./Code/MinimalLib/docker/docker_compose_build_minimallib.yml build
