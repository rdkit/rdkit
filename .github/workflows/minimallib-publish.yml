name: Publish MinimalLib

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # For npm Trusted Publishing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WASM
        env:
          GET_SRC: copy
        run: |
          cd ./Code/MinimalLib
          bash scripts/build_rdkitjs.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Test WASM artifacts
        run: node Code/MinimalLib/tests/tests.js

      - name: Make package
        working-directory: Code/MinimalLib/build
        run: npm pack

      - name: Get package version
        id: version
        working-directory: Code/MinimalLib/build
        run: |
          VERSION=$(jq -r .version package.json)
          # RDKit versions look like 2027.03.1 or 2027.03.1pre (no hyphen).
          # npm cleans the latter to 2027.3.1-pre on publish, which is a prerelease.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_PRERELEASE="false"
          else
            IS_PRERELEASE="true"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Publishing @rdkit/rdkit@$VERSION (prerelease=$IS_PRERELEASE)"

      - name: Debug npm and OIDC
        run: |
          npm --version
          node --version
          echo "OIDC URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "OIDC TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"

      # For Trusted Publishing (OIDC), npm expects the publish to
      # use the trusted publishing flow. The npm documentation
      # recommends --provenance
      - name: Publish to npm
        working-directory: Code/MinimalLib/build
        run: |
          IS_PRERELEASE="${{ steps.version.outputs.is_prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
