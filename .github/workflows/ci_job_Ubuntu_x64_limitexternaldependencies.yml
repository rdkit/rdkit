name: Ubuntu_x64_limitexternaldependencies

on:
  workflow_call:

jobs:
  Ubuntu_x64_limitexternaldependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHON: python=3.14
      BOOST_VERSION: "1.92"
    steps:
      - uses: actions/checkout@v7
      - name: Set up CI environment
        uses: ./.github/actions/ci-env
      - name: Set up package management
        uses: ./.github/actions/setup-package-management
      - name: Setup build environment
        run: |
          sudo apt-get install g++ wget make libgl1-mesa-dev mesa-common-dev
          source ${CONDA}/etc/profile.d/conda.sh
          sudo chown -R ${USER} ${CONDA}
          conda config --set always_yes yes --set changeps1 no
          conda update -q conda
          conda config --set channel_priority strict
          conda config --add channels conda-forge
          conda config --set solver libmamba
          conda info -a
          conda create --name rdkit_build -c conda-forge --override-channels ${PYTHON} cmake \
              libboost=${BOOST_VERSION} libboost-devel=${BOOST_VERSION} \
              libboost-python=${BOOST_VERSION} libboost-python-devel=${BOOST_VERSION} \
              numpy pillow eigen pandas=3 \
              qt pytest ccache
          conda activate rdkit_build
          conda config --env --add channels conda-forge
          conda config --env --set channel_priority strict
      - name: Restore ccache
        id: cache-restore
        uses: ./.github/actions/restore-ccache
      - name: Configure build (Run CMake)
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          mkdir build && cd build && \
          cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DRDK_INSTALL_INTREE=ON \
          -DRDK_INSTALL_STATIC_LIBS=OFF \
          -DRDK_BUILD_CPP_TESTS=ON \
          -DRDK_BUILD_BOOST_PYTHON_WRAPPERS=ON \
          -DRDK_BUILD_NANOBIND_WRAPPERS=OFF \
          -DRDK_BUILD_CHEMDRAW_SUPPORT=OFF \
          -DRDK_BUILD_COORDGEN_SUPPORT=OFF \
          -DRDK_BUILD_MAEPARSER_SUPPORT=OFF \
          -DRDK_OPTIMIZE_POPCNT=ON \
          -DRDK_BUILD_TEST_GZIP=OFF \
          -DRDK_BUILD_FREESASA_SUPPORT=OFF \
          -DRDK_BUILD_FREETYPE_SUPPORT=OFF \
          -DRDK_BUILD_AVALON_SUPPORT=OFF \
          -DRDK_BUILD_INCHI_SUPPORT=OFF \
          -DRDK_BUILD_CAIRO_SUPPORT=OFF \
          -DRDK_BUILD_QT_SUPPORT=OFF \
          -DRDK_BUILD_XYZ2MOL_SUPPORT=ON \
          -DRDK_BUILD_PUBCHEMSHAPE_SUPPORT=OFF \
          -DRDK_BUILD_SWIG_WRAPPERS=OFF \
          -DRDK_SWIG_STATIC=OFF \
          -DRDK_BUILD_THREADSAFE_SSS=OFF \
          -DRDK_TEST_MULTITHREADED=OFF
      - name: Build
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          cd build
          make -j $(nproc) install
      - name: Trim and store ccache
        uses: ./.github/actions/store-ccache
        if: ${{ success() && steps.cache-restore.outputs.cache-hit != 'true' }}
      - name: Show ccache stats
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          echo -e "Current build stats:"
          ccache --show-log-stats
          echo -e "Global stats:"
          ccache -s
      - name: Run tests
        run: |
          source ${CONDA}/etc/profile.d/conda.sh
          conda activate rdkit_build
          export RDBASE=`pwd`
          export PYTHONPATH=${RDBASE}:${PYTHONPATH}
          export LD_LIBRARY_PATH=${RDBASE}/lib:${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}
          echo "LD_LIBRARY_PATH: " $LD_LIBRARY_PATH
          export QT_QPA_PLATFORM='offscreen'
          cd build
          ctest -j $(nproc) --output-on-failure -T Test
